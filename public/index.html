<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Connect Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 20px auto;
      padding: 0 12px;
    }

    section {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 18px;
    }

    input,
    button {
      padding: 9px;
      margin: 5px 5px 5px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      cursor: pointer;
      background: #111;
      color: white;
      border: none;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #f5f5f5;
      padding: 8px 10px;
      border-radius: 8px;
      margin: 6px 0;
    }

    .mine {
      background: #d8ecff;
    }
  </style>
</head>
<body>
  <h1>Secure Connect Demo</h1>

  <section>
    <h2>Login</h2>
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />
    <button onclick="login()">Login</button>
    <p id="auth-status"></p>
  </section>

  <section>
    <h2>Real-Time Chat</h2>
    <button onclick="connectSocket()">Connect Socket</button>
    <div id="typing"></div>
    <ul id="messages"></ul>
    <input id="chat" placeholder="Type a message" oninput="emitTyping()" />
    <button onclick="sendMessage()">Send</button>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let token = localStorage.getItem('token');
    let socket;

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (data.success) {
          token = data.data.token;
          localStorage.setItem('token', token);
          document.getElementById('auth-status').textContent =
            `Logged in as ${data.data.user.email}`;
        } else {
          document.getElementById('auth-status').textContent = data.message;
        }
      } catch {
        document.getElementById('auth-status').textContent =
          'Login request failed.';
      }
    }

    function connectSocket() {
      if (!token) {
        alert('Login first.');
        return;
      }

      socket = io({
        auth: { token }
      });

      socket.on('connect', () => {
        addMessage('System', 'Socket connected.');
      });

      socket.on('chat:connected', (data) => {
        addMessage('System', data.message);
      });

      socket.on('chat:message', (msg) => {
        addMessage(
          msg.sender.email,
          msg.text,
          msg.sender.id === getUserId()
        );
      });

      socket.on('chat:presence', (presence) => {
        addMessage('System', `${presence.email} is ${presence.status}`);
      });

      socket.on('typing:start', (data) => {
        document.getElementById('typing').textContent =
          `${data.email} is typing...`;
      });

      socket.on('typing:stop', () => {
        document.getElementById('typing').textContent = '';
      });

      socket.on('connect_error', (error) => {
        addMessage('Error', error.message);
      });
    }

    function getUserId() {
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        return payload.sub;
      } catch {
        return null;
      }
    }

    function sendMessage() {
      const input = document.getElementById('chat');
      const text = input.value.trim();

      if (!socket || !text) return;

      socket.emit('chat:message', { text, room: 'public' }, (response) => {
        if (response?.success) {
          addMessage('You', text, true);
          input.value = '';
          socket.emit('typing:stop', { room: 'public' });
        } else {
          alert(response?.message || 'Failed to send message.');
        }
      });
    }

    function emitTyping() {
      if (socket) {
        socket.emit('typing:start', { room: 'public' });
      }
    }

    function addMessage(sender, text, mine = false) {
      const li = document.createElement('li');
      li.textContent = `${sender}: ${text}`;

      if (mine) {
        li.className = 'mine';
      }

      document.getElementById('messages').appendChild(li);
    }
  </script>
</body>
</html>
